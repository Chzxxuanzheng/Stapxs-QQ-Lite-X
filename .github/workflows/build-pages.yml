name: 编译 web 端

on:
    push:
        branches:
            - web
            - test
        paths:
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - vite.config.ts
            - tsconfig.web.json
            - tsconfig.json
            - README/pages/**
            - LICENSE
            - src/renderer/**
            - .github/workflows/build-pages.yml
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: 拉取分支
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 100

            - name: 安装 pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 10 # 或者你本地使用的版本
                  run_install: false

            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 25.x
                  cache: 'pnpm' # 自动处理 pnpm store 的缓存，无需手动写 cache 步骤

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 设置环境变量
              run: |
                  echo VITE_HASH=$(git rev-parse --short=7 HEAD) >> $GITHUB_ENV
                  echo VERSION=$(node -p "require('./package.json').version") >> $GITHUB_ENV
                  echo VITE_LOCAL_LIB=false >> $GITHUB_ENV
                  echo VITE_CDN_BASE=https://cdn.jsdelivr.net/gh/chzxxuanzheng/Stapxs-QQ-Lite-X@${{ github.ref_name }}-pages/ >> $GITHUB_ENV

            - name: 构建
              run: pnpm build

            - name: 添加README,证书,ci
              run: |
                  cp ./README/pages/README.md ./dist/README.md
                  cp ./LICENSE ./dist/LICENSE
                  mkdir -p ./dist/.github/workflows
                  wget https://raw.githubusercontent.com/Chzxxuanzheng/Stapxs-QQ-Lite-X/test/.github/workflows/github-pages.yml -O ./dist/.github/workflows/github-pages.yml

            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: stapxs-qq-lite-x-${{ env.VERSION }}-${{ env.VITE_HASH }}-web
                  path: ./dist

            - name: 更新到分支
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: ${{ github.ref_name }}-pages
                  folder: dist

            - name: 触发部署工作流
              uses: peter-evans/repository-dispatch@v2
              with:
                  event-type: deploy-github-pages
