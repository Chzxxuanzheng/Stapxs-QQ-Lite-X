# 基础配置
appId: cn.stapxs.qqwebx
productName: Stapxs QQ Lite X
copyright: Copyright © 2025-2026 Mr.Lee, and other contributors.
directories:
    buildResources: build,
    output: dist_electron
files:
    - '!**/.vscode/*'
    - '!src/*'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!vite.config.{js,ts,mjs,cjs}'
    - '!capacitor.config.{js,ts,mjs,cjs}'
    - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,README/*}'
    - '!{.env,.env.*,.envrc,.gitmodules,.tool-versions,stats.html}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
    - '!{dist*/*,build/*,scripts/*}'
    - '!{scripts/*,dockerfile}'
    - '!{ssqq.capacitor-onebot-connector,ssqq.npx-web-quick-start}/**/*'

asarUnpack:
    - resources/**

# Windows 配置
win:
    # 临时仅对 Windows 关闭 asar，避免传递依赖在该平台打包时被遗漏
    asar: false
    target:
        - { target: portable, arch: x64 }
    executableName: Stapxs QQ Lite X
    icon: build/icon-client-others.png
    legalTrademarks: Copyright © 2025-2026 Mr.Lee, and other contributors.

# macOS 配置
mac:
    target:
        - { target: dmg, arch: arm64 }
        - { target: dmg, arch: x64 }
    entitlementsInherit: build/entitlements.mac.plist
    icon: build/icon-client-mac.icns
    darkModeSupport: true
dmg:
    writeUpdateInfo: false
    background: build/dmg-bg.png
    icon: build/icon-client-mac.icns
    iconSize: 80
    contents:
        - { x: 112, y: 110 }
        - { x: 396, y: 110, type: link, path: /Applications }

# Linux 配置
linux:
    target:
        - { target: pacman, arch: x64 }
        - { target: AppImage, arch: x64 }
        - { target: deb, arch: x64 }
        - { target: deb, arch: arm64 }
        - { target: tar.gz, arch: x64 }
    maintainer: Mr.Lee
    vendor: Mr.Lee
    synopsis: 一个跨协议的 Stapxs QQ Lite 发行版。
    category: Network
    mimeTypes: [application/x-stapxs-qq-lite-x]
    desktop:
        entry:
            GenericName: Stapxs QQ Lite X Electron 客户端

# 其他配置
npmRebuild: false
